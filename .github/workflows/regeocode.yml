name: Regeocode approved corrections

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
    # - cron: '*/1 * * * *'
  workflow_dispatch:         # lets you also trigger it manually from GitHub UI

jobs:
  regeocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install firebase-admin geopy
      - run: python regeocode_corrections.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
